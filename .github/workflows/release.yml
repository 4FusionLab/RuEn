name: Test and release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Derive package version from GitVersion
        id: version
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check Python and package all platform ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/package.py --version "${{ steps.version.outputs.version }}"
      - name: Require reviewed notes and verify tagged release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          channel=stable
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then channel=prerelease; fi
          notes="docs/releases/$VERSION.md"
          if [[ "$VERSION" == "1.0.0" ]]; then notes=RELEASE_NOTES.md; fi
          python scripts/release_contract.py --version "$VERSION" --tag "$GITHUB_REF_NAME" \
            --channel "$channel" --manifest RuEn/RuEn.manifest \
            --archive "dist/RuEn-$VERSION-universal.zip" \
            --archive "dist/RuEn-$VERSION-macos.zip" \
            --archive "dist/RuEn-$VERSION-windows.zip" \
            --notes "$notes"
      - uses: actions/upload-artifact@v4
        with:
          name: RuEn-distributions
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ruen-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: RuEn-distributions
          path: dist
      - name: Verify and publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          channel=stable
          notes="docs/releases/$version.md"
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            channel=prerelease
            flags=(--prerelease --latest=false)
          fi
          if [[ "$version" == "1.0.0" ]]; then notes=RELEASE_NOTES.md; fi
          python scripts/release_contract.py --version "$version" --tag "$GITHUB_REF_NAME" \
            --channel "$channel" --manifest RuEn/RuEn.manifest \
            --archive "dist/RuEn-$version-universal.zip" \
            --archive "dist/RuEn-$version-macos.zip" \
            --archive "dist/RuEn-$version-windows.zip" \
            --notes "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leave assets unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --verify-tag --target "$GITHUB_SHA" \
            --title "RuEn $GITHUB_REF_NAME" --notes-file "$notes" "${flags[@]}"
