name: Test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: runtime-release-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/release_changes.py --self-test
      - name: Detect addon changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: impact
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/release_changes.py --before "$BEFORE" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
  test:
    needs: changes
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Derive package version from GitVersion
        id: version
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check Python and package all platform ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/package.py --version "${{ steps.version.outputs.version }}"
      - name: Validate release candidate when runtime changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release_notes.py --product RuEn --version "$VERSION" \
            --output "$RUNNER_TEMP/release-notes.md" --candidate "docs/releases/$VERSION.md"
          python scripts/release_contract.py --version "$VERSION" --tag "v$VERSION" \
            --channel stable --manifest RuEn/RuEn.manifest \
            --archive "dist/RuEn-$VERSION-universal.zip" \
            --archive "dist/RuEn-$VERSION-macos.zip" \
            --archive "dist/RuEn-$VERSION-windows.zip" \
            --notes "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: RuEn-distributions
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    needs: [test, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ruen-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: RuEn-distributions
          path: dist
      - name: Verify packages and publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          python scripts/release_notes.py --product RuEn --version "$VERSION" \
            --output "$RUNNER_TEMP/release-notes.md" --candidate "docs/releases/$VERSION.md"
          python scripts/release_contract.py --version "$VERSION" --tag "$tag" \
            --channel stable --manifest RuEn/RuEn.manifest \
            --archive "dist/RuEn-$VERSION-universal.zip" \
            --archive "dist/RuEn-$VERSION-macos.zip" \
            --archive "dist/RuEn-$VERSION-windows.zip" \
            --notes "$RUNNER_TEMP/release-notes.md"
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo "Immutable version tag belongs to another commit: $tag" >&2
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Already published: $tag"
            exit 0
          fi
          gh release create "$tag" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --title "RuEn $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
